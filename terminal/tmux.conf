# tmux configuration
#
# Written to make tmux safe to run Neovim inside. The first four settings are not
# cosmetic -- without them the editor misbehaves in ways that are easy to blame on
# Neovim rather than on tmux.
#
# Prefix is left at the default Ctrl-b.

# --- Settings Neovim depends on -------------------------------------------

# tmux waits 500ms after Escape by default, guessing whether a key sequence
# follows. In Neovim that makes <Esc> feel broken. 10ms is enough for real
# escape sequences and imperceptible when leaving insert mode.
set -sg escape-time 10

# Truecolour. Without these the tokyonight theme loses its palette inside tmux
# and renders as approximated 256-colour. tmux-256color is present in macOS's
# terminfo (checked), so it is safe as the default.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -ga terminal-overrides ",xterm-256color:Tc"

# Neovim's autoread and FocusGained/FocusLost autocmds need these forwarded.
set -g focus-events on

# Neovim asks iTerm2 for a background painting with an OSC 1337 sequence, which
# tmux does not recognise and so drops on the floor. tmux forwards unknown
# escapes only when told to, and only in the DCS passthrough form that
# lua/config/painting.lua wraps them in. Without this, `dev` sessions get no
# painting while a bare shell does, which is a confusing way to find out.
set -g allow-passthrough on

# Dev server output is long; the default 2000 lines loses the start of a build.
set -g history-limit 10000

# --- Usability ------------------------------------------------------------

# Click a window, click a pane, scroll a log. Worth having while tmux is new.
set -g mouse on

# Window numbers start at 0 so they match the `0:editor 1:serve` labels the dev
# launcher creates, and closing a window renumbers the rest so the keys stay
# contiguous.
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on

# Show a little more of what is going on, and keep the status bar quiet.
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 60
set -g status-style "bg=#1a1b26,fg=#a9b3d9"
set -g status-left "#[fg=#7aa2f7,bold] #S #[default]"
set -g status-right "#[fg=#565f89]%H:%M "
setw -g window-status-current-style "fg=#7aa2f7,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
set -g pane-border-style "fg=#2c3048"
set -g pane-active-border-style "fg=#7aa2f7"

# vi keys in copy mode, since that is the muscle memory Neovim builds.
setw -g mode-keys vi

# Split panes in the current directory rather than wherever the session started.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move between panes with the same keys Neovim uses.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload this file.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
